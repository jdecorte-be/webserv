<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>John Decorte</title>
	<link rel="icon" href="/favicon.ico" sizes="any">
	<link rel="shortcut icon" href="/favicon.ico">
	<style>
		:root {
			--bg-start: #1f2329;
			--bg-end: #12151a;
			--card: #262b33;
			--card-border: #363c46;
			--text: #e6e8eb;
			--muted: #9aa4b2;
			--accent: #6ea8fe;
			--accent-2: #a78bfa;
		}

		* {
			box-sizing: border-box;
		}

		html, body {
			margin: 0;
			height: 100%;
		}

		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background: radial-gradient(circle at 30% 20%, #2a3040 0%, var(--bg-start) 45%, var(--bg-end) 100%);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			color: var(--text);
		}

		.card {
			width: 100%;
			max-width: 360px;
			background: var(--card);
			border: 1px solid var(--card-border);
			border-radius: 20px;
			padding: 40px 32px 32px;
			text-align: center;
			box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
		}

		.avatar {
			width: 96px;
			height: 96px;
			margin: 0 auto 20px;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 2rem;
			font-weight: 700;
			letter-spacing: 1px;
			color: #fff;
			background: linear-gradient(135deg, var(--accent), var(--accent-2));
			box-shadow: 0 8px 24px rgba(110, 168, 254, 0.35);
		}

		h1 {
			margin: 0 0 4px;
			font-size: 1.4rem;
			letter-spacing: 0.3px;
		}

		.tagline {
			margin: 0 0 28px;
			color: var(--muted);
			font-size: 0.92rem;
		}

		.links {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.links a {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 11px 16px;
			border-radius: 12px;
			background: rgba(255, 255, 255, 0.03);
			border: 1px solid var(--card-border);
			color: var(--text);
			text-decoration: none;
			font-size: 0.92rem;
			transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
		}

		.links a:hover {
			background: rgba(110, 168, 254, 0.12);
			border-color: var(--accent);
			transform: translateY(-1px);
		}

		.links svg {
			width: 18px;
			height: 18px;
			flex-shrink: 0;
			fill: var(--muted);
			transition: fill 0.15s ease;
		}

		.links a:hover svg {
			fill: var(--accent);
		}

		.links span {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.print-link {
			margin-top: 24px;
		}

		.print-link a {
			color: var(--muted);
			font-size: 0.8rem;
			text-decoration: none;
			border-bottom: 1px dotted var(--card-border);
		}

		.print-link a:hover {
			color: var(--accent);
		}
	</style>
</head>
